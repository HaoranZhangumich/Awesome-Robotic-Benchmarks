name: MuJoCo
domain: Simulation
area: physics
first_release_date: 2012
venue: "IROS 2012"
widely_used: true
description: "General-purpose physics engine for articulated bodies in contact, maintained by Google DeepMind; the backend of many manipulation and locomotion benchmarks. Batched GPU simulation comes through MJX (JAX) and MuJoCo Warp (with NVIDIA); version 4.0 was released in November 2026."
physics_engine: "MuJoCo (CPU); MJX (JAX) and MuJoCo Warp for GPU"
renderer: "OpenGL, Filament; MuJoCo Warp batch ray tracer"
gpu_support: true
os: [Linux, Windows, macOS]
license: "Apache-2.0"
resources:
