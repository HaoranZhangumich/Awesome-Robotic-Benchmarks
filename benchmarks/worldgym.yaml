description: "Policy evaluation environment built on an autoregressive action-conditioned video model: policies are rolled out from real first frames and a VLM judges success. Success rates of RT-1-X, Octo and OpenVLA inside the model track real-robot results on the OpenVLA Bridge tasks (r = 0.78)."
task_count: "17 Bridge tasks from the OpenVLA evaluation, plus Google Robot and OOD tasks"
metric_count: "2 (VLM-judged success rate; Pearson correlation with real-world success)"
robot_config_count: "2 evaluated (Bridge robot, Google Robot)"
