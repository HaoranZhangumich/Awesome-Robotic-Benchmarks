name: EmbodiedBench
domain: Embodied Reasoning
area: planning
subtype: "MLLM agents, high- and low-level control"
first_release_date: 2025-02-13
venue: "ICML 2025"
description: "Benchmark for multimodal LLMs as vision-driven embodied agents in four simulated environments: EB-ALFRED and EB-Habitat (high-level household tasks), EB-Navigation and EB-Manipulation (low-level navigation and manipulation). Six capability subsets probe commonsense, complex instructions, spatial awareness, visual perception and long-horizon planning."
task_count: "1,128 test instances across 4 environments"
metric_count: "3 (task success rate, subgoal success rate, planner / environment steps)"
robot_config_count: "3 (AI2-THOR agent, Habitat robot, Franka Panda)"
modality: [RGB, language]
setting: [sim]
sim_backend: "AI2-THOR (EB-ALFRED, EB-Navigation), Habitat 2.0, CoppeliaSim (EB-Manipulation)"
data_source:
  size: "1,128 test instances (300 / 300 / 300 / 228 per environment)"
  collection_method: mixed
resources:
  homepage: "https://embodiedbench.github.io"
  paper: "https://arxiv.org/abs/2502.09560"
  code: "https://github.com/EmbodiedBench/EmbodiedBench"
  data: "https://huggingface.co/EmbodiedBench"
  leaderboard: "https://embodiedbench.github.io/#leaderboard-findings"
