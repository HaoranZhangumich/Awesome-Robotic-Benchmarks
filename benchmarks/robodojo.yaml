description: "Unified sim-and-real benchmark for generalist manipulation policies: 42 Isaac Sim tasks grouped into generalisation, memory, precision, long-horizon and open-vocabulary instruction following, plus 18 real-world tasks on three bimanual platforms run remotely through the RoboDojo-RealEval system."
task_count: "60 (42 simulation, 18 real-world)"
metric_count: "2 (success rate, progress score)"
robot_config_count: "3 (ARX X5, Piper, Piper X; all bimanual)"
