name: Argoverse 2
domain: Autonomous Driving
area: driving-data
subtype: "3D perception, motion forecasting"
first_release_date: 2021
venue: "NeurIPS 2021 D&B"

description: "Four datasets from six US cities, all with HD maps: 1,000 annotated multi-sensor sequences, 20,000 unlabeled lidar sequences, 250,000 motion-forecasting scenarios and 1,000 map-change scenarios. Its CVPR challenges continue, in 2026 on scenario mining and lidar scene flow."

task_count: "6 (detection, scene flow, 4D occupancy, E2E/motion forecasting, scenario mining)"
