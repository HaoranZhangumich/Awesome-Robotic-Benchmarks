modality: [state, RGB]
setting: [sim]
sim_backend: "MuJoCo; also CARLA, Flow (SUMO), MiniGrid and PyBullet variants"

data_source:
  size: "One fixed dataset per task, in variants such as random, medium, expert, human and play"
  collection_method: mixed

