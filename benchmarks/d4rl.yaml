description: "Offline RL benchmark with fixed datasets and an evaluation protocol across seven simulated domains (Maze2D, AntMaze, Gym-MuJoCo locomotion, Adroit hand, Franka Kitchen, Flow, CARLA), scored by normalized return. Still the default offline RL testbed; development has moved to Minari, which now hosts its datasets."

task_count: "7 domains (Maze2D, AntMaze, Gym-MuJoCo, Adroit, Franka Kitchen, Flow, CARLA)"
metric_count: "1 (normalized score: 0 = random policy, 100 = expert)"
