name: RoboCerebra
domain: Manipulation
area: tabletop
subtype: "long-horizon, high-level (System 2) planning"
first_release_date: 2025-06-07
venue: "NeurIPS 2025"
description: "Long-horizon benchmark built on LIBERO that evaluates the planning, reflection and memory of a VLM planner paired with a VLA controller. 1,000 human-teleoperated trajectories of about 3,000 steps each, with LLM-generated subtask decompositions; evaluation on 60 tasks, 10 trials each."
task_count: "60 evaluation tasks (1,000 trajectories over 100 task variants)"
metric_count: "4 (task success, plan accuracy, plan efficiency, action completion)"
robot_config_count: "1 (Franka Panda)"
modality: [RGB, proprioceptive, language]
setting: [sim]
sim_backend: "LIBERO (robosuite / MuJoCo)"
data_source:
  size: "1,000 human-teleoperated trajectories, 2,972 steps on average"
  collection_method: human_demonstration
resources:
  homepage: "https://robocerebra.github.io/"
