name: RoboWM-Bench
domain: World Models
area: wm-embodied
subtype: "executability of generated video, real-to-sim"
first_release_date: 2026-04-21
venue: "CVPR 2026 Workshop (WMAS)"
description: "Tests whether manipulation videos generated by world models are physically executable: human-hand videos are retargeted and robot videos passed through an inverse dynamics model, then replayed in simulation scenes reconstructed from real setups and scored by task and step success."
task_count: "24 (10 human-hand, 8 real-to-sim robot, 6 simulation-native robot)"
metric_count: "2 (task-level and step-level success rate)"
robot_config_count: "2 (Franka arm; human hand retargeted to a gripper)"
modality: [video, RGB, language]
setting: [sim]
sim_backend: "Isaac Lab (LeHome)"
data_source:
  size: "10 initial object configurations per task"
  collection_method: none
resources:
  homepage: "https://robowm-bench.github.io/RoboWM-Bench/"
  paper: "https://arxiv.org/abs/2604.19092"
  code: "https://github.com/fffstrong/RoboWM-Bench"
