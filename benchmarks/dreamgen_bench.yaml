metric_count: "2 (instruction following, physics alignment)"
robot_config_count: "2 (Franka in RoboCasa, Fourier GR1 humanoid)"
modality: [video, RGB, language]
setting: [sim, real]
sim_backend: "RoboCasa"
data_source:
  size: "about 50 start frames per set (48 RoboCasa; 50 / 47 / 30 GR1)"
  collection_method: human_annotation
resources:
