description: "First large UAV vision-and-language navigation benchmark: a drone follows long natural-language flight instructions through 25 near-realistic city-level scenes with continuous 3D motion. Paths were flown by licensed human pilots and described by crowd workers."
task_count: "1 (aerial instruction following; 8,446 paths)"
metric_count: "4 (NE, SR, OSR, SDTW)"
