modality: [RGB, depth, language]
setting: [sim]
sim_backend: "AirSim (Unreal Engine 4)"
data_source:
  size: "8,446 flight paths, 25,338 instructions, 25 city scenes (plus AerialVLN-S)"
  collection_method: human_demonstration
resources:
