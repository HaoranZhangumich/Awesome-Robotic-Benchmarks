name: DriveLM
domain: Autonomous Driving
area: driving-data
subtype: "driving VQA, vision-language"
first_release_date: 2023-12-21
venue: "ECCV 2024"

description: "Graph visual question answering for driving: perception, prediction and planning questions about key objects are linked by logical dependencies. DriveLM-nuScenes has 4,871 annotated frames with about 91 QA pairs each; DriveLM-CARLA is generated by a rule-based expert. Basis of the CVPR 2024 Driving-with-Language challenge."

task_count: "1 (graph VQA over perception, prediction, planning, behavior, motion)"
metric_count: "4 in the challenge (accuracy, ChatGPT score, language metrics, match score)"
robot_config_count: "1 (nuScenes car with 6 cameras), plus the CARLA ego vehicle"

modality: [RGB, language]
setting: [sim, real]
sim_backend: "CARLA (DriveLM-CARLA split)"

data_source:
  size: "DriveLM-nuScenes: 4,871 frames (avg. 91.4 QAs each); DriveLM-CARLA: 64,285 frames (avg. 24.4)"
  collection_method: mixed

resources:
  homepage: "https://opendrivelab.com/DriveLM/"
  paper: "https://arxiv.org/abs/2312.14150"
  code: "https://github.com/OpenDriveLab/DriveLM"
  data: "https://huggingface.co/datasets/OpenDriveLab/DriveLM"
  leaderboard: "https://huggingface.co/spaces/AGC2024/driving-with-language-official"
