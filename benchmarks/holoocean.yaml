description: "Underwater robotics simulator from BYU's Field Robotic Systems Lab on Unreal Engine, with imaging, profiling and sidescan sonar, DVL, IMU, camera and depth sensors, multi-agent support and ROS 2. HoloOcean 2.0 (2025) moved to Unreal Engine 5.3 with Fossen vehicle dynamics. The source repository needs an Epic-linked GitHub account."
physics_engine: "Unreal Engine 5 with Fossen-model vehicle dynamics"
