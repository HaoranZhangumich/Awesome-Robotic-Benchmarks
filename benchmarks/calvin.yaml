name: CALVIN
domain: Manipulation
area: tabletop
subtype: "table-top, language-conditioned, long-horizon"
first_release_date: 2021-12-06
venue: "RA-L 2022"
widely_used: true
description: "Long-horizon language-conditioned manipulation with a Franka Panda in four tabletop environments (A-D). Policies trained on teleoperated play data must complete chains of five instructions; the ABC-to-D split tests zero-shot transfer to an unseen environment."
task_count: 34
metric_count: "2 (success rate for 1-5 chained tasks, average sequence length)"
robot_config_count: "1 (Franka Panda)"
modality: [RGB, depth, tactile, proprioceptive, language]
setting: [sim]
sim_backend: "PyBullet"
data_source:
  size: "~24 h of teleoperated play data (6 h per environment), 20K language directives"
  collection_method: human_demonstration
resources:
  homepage: "http://calvin.cs.uni-freiburg.de/"
  paper: "https://arxiv.org/abs/2112.03227"
  code: "https://github.com/mees/calvin"
  data: "https://github.com/mees/calvin/tree/main/dataset"
  leaderboard: "http://calvin.cs.uni-freiburg.de/"
