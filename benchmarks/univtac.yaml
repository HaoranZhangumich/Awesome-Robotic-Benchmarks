description: "Simulation platform and benchmark for visuo-tactile manipulation on Isaac Lab and TacEx, supporting GelSight Mini, ViTai GF225 and Xense WS sensors with automated data generation. The UniVTAC Benchmark has eight contact-rich tasks such as HDMI and tube insertion, key extraction and grasp-and-classify, each with 100 generated demonstrations."
