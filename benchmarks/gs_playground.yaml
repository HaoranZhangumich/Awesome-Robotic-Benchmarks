description: "Simulator for vision-based robot learning that couples its own batched physics engine (MotrixSim) with batch 3D Gaussian Splatting rendering, reporting about 10^4 FPS at 640x480, plus a Real2Sim pipeline for photorealistic scenes. From the DISCOVERSE team at Tsinghua AIR with Motphys; the public repository is a preview release."
