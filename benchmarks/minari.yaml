first_release_date: 2022-11-04

description: "Farama Foundation's standard format, API and hosting for offline RL datasets, and the maintained successor to D4RL. Its reference collections re-create the D4RL robot tasks (AntMaze, PointMaze, Adroit hand, Franka Kitchen) on current Gymnasium environments and add MuJoCo, Atari and MiniGrid sets."

task_count: "6 hosted collections with about 340 datasets"
metric_count: "1 (episode return; reference scores for D4RL-derived datasets)"
