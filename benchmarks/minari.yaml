modality: [state, RGB]
setting: [sim]
sim_backend: "MuJoCo via Gymnasium and Gymnasium-Robotics; Atari and MiniGrid"

data_source:
  size: "About 340 datasets (D4RL 31, MuJoCo 28, Atari 57, MiniGrid 170, community 52, web agents 1)"
  collection_method: mixed

