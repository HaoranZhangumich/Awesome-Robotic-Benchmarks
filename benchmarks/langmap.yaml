name: LangMap
domain: Navigation
area: goal-nav
subtype: "hierarchical open-vocabulary goal navigation"
first_release_date: 2026-02-02
venue: "NeurIPS 2026"
description: "Benchmark for the HieraNav task: language goals at four levels (scene, room, region, instance) on HM3D scans, with region labels and discriminative descriptions written and cross-checked by people rather than generated by a VLM. Has single-goal and multi-goal episodes."
task_count: "18,479 tasks at 4 goal levels (single-goal and multi-goal)"
metric_count: "3 (SR, SPL, SeqSR@k)"
robot_config_count: "1 (simulated agent)"
modality: [RGB, depth, language]
setting: [sim]
sim_backend: "Habitat-Sim"
data_source:
  size: "36 HM3D-Sem validation scenes, 414 object categories, 926 region descriptions"
  collection_method: human_annotation
resources:
  homepage: "https://bo-miao.github.io/LangMap"
  paper: "https://arxiv.org/abs/2602.02220"
  code: "https://github.com/bo-miao/LangMap"
  data: "https://huggingface.co/datasets/bo-miao/LangMap"
  leaderboard: ""
