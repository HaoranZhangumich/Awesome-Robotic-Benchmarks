description: "NVIDIA's open-source GPU-accelerated framework for robot learning (reinforcement and imitation learning), grown out of Orbit, with 30+ ready-to-train environments and 16+ robot models. Version 3.0 (October 2026) is multi-backend: PhysX through Isaac Sim, or Newton without Isaac Sim."
physics_engine: "PhysX 5 (Isaac Sim) or Newton (MuJoCo Warp, Kamino, XPBD, VBD)"
renderer: "Omniverse RTX (Isaac Sim), OVRTX, Newton Warp renderer"
gpu_support: true
os: [Linux, Windows]
