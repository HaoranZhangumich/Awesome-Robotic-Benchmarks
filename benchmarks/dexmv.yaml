venue: "ECCV 2022"
description: "Platform that pairs three MuJoCo tasks for an Adroit hand (relocate, pour, place inside) with videos of people doing the same tasks. 3D hand and object poses are estimated from the videos and retargeted into robot demonstrations, which are used to benchmark imitation learning."
