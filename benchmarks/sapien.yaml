name: SAPIEN
domain: Simulation
area: physics
first_release_date: 2020-03-19
venue: "CVPR 2020"
description: "Physics-rich simulator for robotics and embodied AI built on PhysX, released together with the PartNet-Mobility articulated-object dataset. SAPIEN 3 added GPU-parallel PhysX 5 simulation and is the engine underneath ManiSkill."
physics_engine: "NVIDIA PhysX 5 (CPU and GPU)"
renderer: "SapienRenderer (Vulkan rasterisation and ray tracing)"
gpu_support: true
os: [Linux, Windows, macOS]
license: "Apache-2.0"
resources:
  homepage: "https://sapien-sim.github.io/docs/"
  paper: "https://arxiv.org/abs/2003.08515"
  code: "https://github.com/haosulab/SAPIEN"
  docs: "https://sapien-sim.github.io/docs/"
