# Domains and sub-areas of the list, in display order:
# from the most widely used areas down to smaller niches.
#
#   key    the value used in a benchmark file (`domain:` / `area:`)
#   title  the heading shown in the README (defaults to the key)
#   blurb  one line shown under the heading
#   start_here_note  optional remark shown in the "Start here" table
#
# To add a sub-area, add it here first, then use its key in benchmarks/*.yaml.

domains:
  - key: Manipulation
    blurb: "Task suites for robot arms and grippers, in simulation and on real hardware."
    areas:
      - {key: tabletop, title: "Tabletop & Language-Conditioned"}
      - {key: bimanual, title: "Bimanual"}
      - {key: mobile, title: "Mobile & Household"}
      - {key: contact-rich, title: "Assembly & Contact-Rich"}
      - {key: articulated, title: "Articulated Objects"}
      - {key: deformable, title: "Deformable Objects & Garments"}
      - {key: tactile, title: "Tactile"}
      - {key: grasping, title: "Grasping"}

  - key: Dexterous Manipulation
    blurb: "Multi-finger hands: in-hand skills, two-handed dexterity, grasp synthesis, and the human hand-object data that robot hands learn from."
    areas:
      - {key: dex-manipulation, title: "In-Hand & Dexterous Skills"}
      - {key: dex-bimanual, title: "Bimanual Dexterity"}
      - {key: dex-grasping, title: "Dexterous Grasping"}
      - {key: hand-object-data, title: "Human Hand-Object Data"}

  - key: Generalist
    title: "Generalist Policies & VLA Evaluation"
    blurb: "How generalist robot policies and vision-language-action models (VLAs) are evaluated: multi-domain suites, real robots, simulated stand-ins for real setups, and stress tests."
    areas:
      - {key: multi-domain, title: "Multi-Domain Suites"}
      - {key: real-eval, title: "Real-World Evaluation"}
      - {key: real2sim, title: "Real-to-Sim Evaluation"}
      - {key: probes, title: "Generalization, Robustness & Memory Probes"}

  - key: World Models
    title: "World Models & World-Action Models"
    blurb: "Benchmarks for learned simulators of the physical world, for world models that score robot policies, and for the physical plausibility of generated video."
    start_here_note: "No embodied world-model benchmark is a settled standard yet; these are the common physical-plausibility tests for video generators."
    areas:
      - {key: wm-embodied, title: "Embodied World Models"}
      - {key: wm-policy-eval, title: "Policy Evaluation with World Models & WAM Benchmarks"}
      - {key: wm-physics, title: "Physical Plausibility of Generated Video"}

  - key: Embodied Reasoning
    blurb: "Benchmarks that test vision-language models and LLMs as the reasoning and planning layer of a robot."
    areas:
      - {key: spatial, title: "Spatial & Physical Reasoning"}
      - {key: planning, title: "Task Planning & Agents"}
      - {key: eqa, title: "Embodied Question Answering"}

  - key: Navigation
    blurb: "Goal-driven, language-guided, social and outdoor navigation."
    areas:
      - {key: goal-nav, title: "Point, Object & Image-Goal Navigation"}
      - {key: vln, title: "Vision-Language Navigation (VLN)"}
      - {key: interactive, title: "Interactive Instruction Following"}
      - {key: social, title: "Social Navigation"}
      - {key: outdoor, title: "Outdoor, Urban & Aerial"}

  - key: Locomotion
    title: "Locomotion & Humanoids"
    blurb: "Continuous-control suites, legged locomotion, humanoid whole-body control, and the motion data behind humanoid tracking."
    areas:
      - {key: continuous-control, title: "Classic Continuous Control"}
      - {key: legged, title: "Legged Locomotion"}
      - {key: humanoid, title: "Humanoid & Whole-Body Control"}
      - {key: motion-data, title: "Motion Data for Humanoids"}

  - key: Datasets
    title: "Robot Learning Datasets"
    blurb: "Large open datasets that policies are trained and compared on."
    areas:
      - {key: robot-data, title: "Robot Datasets"}
      - {key: human-data, title: "Egocentric & Human Data"}

  - key: Simulation
    title: "Simulators"
    blurb: "The engines and frameworks the benchmarks above are built on. This section compares capabilities instead of tasks."
    areas:
      - {key: physics, title: "Physics Engines & General Simulators"}
      - {key: learning-framework, title: "Robot-Learning Frameworks"}
      - {key: embodied-platform, title: "Embodied-AI Platforms"}
      - {key: specialized, title: "Specialized Simulators"}

  - key: HRI
    title: "Human-Robot Interaction"
    blurb: "Assistive robots, handovers, and collaboration between people and robots."
    areas:
      - {key: assistive, title: "Assistive & Physical HRI"}
      - {key: handover, title: "Handover"}
      - {key: collaboration, title: "Human-Robot Collaboration"}

  - key: Safety
    blurb: "Safe reinforcement learning and control, and the safety of LLM- and VLA-driven robots."
    areas:
      - {key: safe-rl, title: "Safe RL & Control"}
      - {key: embodied-safety, title: "Safety of LLM / VLA Agents"}

  - key: Autonomous Driving
    blurb: "The driving benchmarks that robotics work most often borrows from. Kept short on purpose."
    areas:
      - {key: driving-data, title: "Datasets & Open-Loop Benchmarks"}
      - {key: driving-closed-loop, title: "Closed-Loop Simulation"}

  - key: Other
    title: "Other Areas"
    blurb: "Smaller areas that sit next to the domains above."
    areas:
      - {key: offline-rl, title: "Offline RL & Data-Driven Control"}
      - {key: aerial, title: "Aerial Robotics"}
      - {key: multi-robot, title: "Multi-Robot"}
      - {key: competition, title: "Competitions"}
      - {key: misc, title: "Miscellaneous"}
